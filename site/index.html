<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)">
<meta name="description" content="수도권 아파트 매물이 기준가 대비 얼마나 싼지(급매판정)와 토지거래허가 소식·처리 현황(토허제 라이브)을 한 곳에서. 20년 실거래로 동·층·타입을 보정한 가치판정 + 허가 파이프라인.">
<title>APT 레이더 — 급매판정 · 토허제 라이브</title>
<link rel="icon" href="data:,">
<link rel="alternate" type="application/rss+xml" title="새 급매" href="feed/all.xml">
<link rel="alternate" type="application/rss+xml" title="토지거래허가 소식" href="feed/toheo/all.xml">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#F6F7F5; --panel:#FFFFFF; --ink:#1B2130; --ink2:#454C58; --mute:#7B828C; --line:#D9DEE3; --line2:#EEF0F2;
  --cheap:#1F56C9; --cheap-bg:#E8EFFC; --dear:#C93A3A; --dear-bg:#FBEAEA; --hi:#FFE55C; --ok:#2E8B57;
  --r:10px; --tab:60px;
  --warn-bg:#FFF7D6; --warn-line:#F1E2A0; --warn-ink:#8A6D1A; --ok-bg:#E6F4EC; --toheo:#1F6F5B; --toheo-bg:#E6F2EE; --s2:#C2410C;
  --top-bg:rgba(246,247,245,.92); --card-active:#FAFBFA;
  --on-ink:#FFFFFF; /* --ink 배경 위 글자색 (다크에서는 --ink 가 밝아지므로 어두운 색) */
  color-scheme:light;
}
/* 다크모드: 토허 원본처럼 prefers-color-scheme 토큰. data-theme 로 강제 가능 */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1419; --panel:#171D25; --ink:#E6E8EB; --ink2:#C3C9D1; --mute:#9AA3AD; --line:#2A323D; --line2:#1F2731;
    --cheap:#6D9BFF; --cheap-bg:#13213A; --dear:#F87171; --dear-bg:#2B1515; --hi:#8A6A00; --ok:#4ADE80;
    --warn-bg:#2A2010; --warn-line:#5A4A1A; --warn-ink:#F5C04A; --ok-bg:#0F2A19; --toheo:#3FA58A; --toheo-bg:#1C2F29; --s2:#FB923C;
    --top-bg:rgba(15,20,25,.92); --card-active:#1F2731; --on-ink:#0F1419; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1419; --panel:#171D25; --ink:#E6E8EB; --ink2:#C3C9D1; --mute:#9AA3AD; --line:#2A323D; --line2:#1F2731;
  --cheap:#6D9BFF; --cheap-bg:#13213A; --dear:#F87171; --dear-bg:#2B1515; --hi:#8A6A00; --ok:#4ADE80;
  --warn-bg:#2A2010; --warn-line:#5A4A1A; --warn-ink:#F5C04A; --ok-bg:#0F2A19; --toheo:#3FA58A; --toheo-bg:#1C2F29; --s2:#FB923C;
  --top-bg:rgba(15,20,25,.92); --card-active:#1F2731; --on-ink:#0F1419; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:15px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:20;background:var(--top-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:54px}
.brand{text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mute);letter-spacing:0;line-height:1}
.search{flex:1;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:19px;background:var(--panel);padding:0 14px 0 36px;outline:none}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:var(--mute)}
.sug{position:absolute;left:0;right:0;top:42px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(27,33,48,.12);max-height:60vh;overflow:auto;display:none;z-index:30}
.sug.on{display:block}
.sug button{display:flex;width:100%;text-align:left;border:0;background:none;padding:10px 14px;gap:10px;align-items:baseline;border-bottom:1px solid var(--line2)}
.sug button:hover,.sug button:focus{background:var(--paper);outline:none}
.sug .nm{font-weight:600}
.sug .meta{color:var(--mute);font-size:12px;margin-left:auto;white-space:nowrap}
main{padding:12px 0 24px}
section.view{display:none}
section.view.on{display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--panel);border-top:1px solid var(--line);display:flex;z-index:20}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--mute);font-size:11px;font-weight:600;position:relative}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--ink)}
nav.tabs a .dot{position:absolute;top:8px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--dear);display:none}
nav.tabs a .dot.on{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;font-size:13px}
.filters label.tg{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.sum{color:var(--mute);font-size:13px;margin:4px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start;text-decoration:none;position:relative}
.card:active{background:var(--card-active)}
/* 카드 전체를 덮는 링크(버튼은 <a> 안에 두지 않고 z-index 로 위에 올린다 — 빗나간 터치가 페이지 이동이 되지 않게) */
.card a.go{position:absolute;inset:0;z-index:0;border-radius:inherit}
.card a.go:focus-visible{outline:2px solid var(--cheap);outline-offset:1px}
.card .acts,.card .body a{position:relative;z-index:1}
.verdict{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pct{font-weight:800;font-size:26px;line-height:1;letter-spacing:-.03em;padding:2px 6px 0;position:relative;display:inline-block}
.pct.cheap{color:var(--cheap)} .pct.dear{color:var(--dear)} .pct.even{color:var(--ink2)}
.pct.hi::before{content:"";position:absolute;left:0;right:0;top:55%;height:12px;background:var(--hi);z-index:-1;border-radius:2px;transform:rotate(-1.5deg)}
.pct{z-index:0}
.grade{display:inline-block;font-size:11px;font-weight:800;padding:2px 6px;border-radius:4px;background:var(--ink);color:var(--on-ink);line-height:1.3}
.grade.SS,.grade.S,.grade.A,.grade.B,.grade.C{color:#fff}
.grade.SS{background:var(--cheap)} .grade.S{background:#3D6FD6} .grade.A{background:#6B8CD0} .grade.B{background:#9AA1AA} .grade.C{background:var(--dear)}
.grade.none{background:var(--line);color:var(--mute)}
.grade.toheo{background:var(--toheo)}
.conf{font-size:11px;color:var(--mute)}
.card .body{min-width:0}
.card .nm{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.card .nm .gu{font-weight:500;color:var(--mute);font-size:12px}
.card .spec{color:var(--ink2);font-size:13px;margin-top:2px}
.card .price{margin-top:6px;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .price .fv{font-weight:500;color:var(--mute);font-size:12px}
.card .why{margin-top:4px;font-size:12.5px;color:var(--ink2)}
.card .why .royal{color:var(--cheap);font-weight:600}
.card .foot{margin-top:6px;display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--mute);flex-wrap:wrap}
.card .foot .tag{border:1px solid var(--line);border-radius:4px;padding:0 5px}
.card .foot .direct{color:var(--dear);border-color:var(--dear-bg);background:var(--dear-bg)}
.card .acts{margin-left:auto;display:flex;gap:6px}
.card .acts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:12px;padding:6px 10px;min-height:32px;color:var(--ink2)}
.card .acts button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.empty{padding:40px 12px;text-align:center;color:var(--mute);font-size:14px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.panel h2{margin-bottom:8px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ph h2{margin-bottom:0}
.panel h2 small{font-weight:500;color:var(--mute);font-size:12px;margin-left:6px}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink2)} .row .v{font-weight:600;text-align:right}
.row .v small{font-weight:400;color:var(--mute);font-size:12px;margin-left:4px}
.bar{display:grid;grid-template-columns:58px 1fr 86px;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.bar .lab{font-weight:600}
.bar .trk{height:12px;position:relative;background:var(--line2);border-radius:3px}
.bar .trk i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar .trk i.p{background:var(--ink2)} .bar .trk i.n{background:#B9C0C8}
.bar .trk b{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mute)}
.bar .val{text-align:right;font-weight:600;white-space:nowrap}
.bar .val small{color:var(--mute);font-weight:400;font-size:11px;margin-left:3px}
.cx-head{padding:4px 0 10px}
.cx-head h1{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cx-head .sub{color:var(--mute);font-size:13px;margin-top:2px}
.cx-head .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.primary{background:var(--cheap);color:#fff;border-color:var(--cheap)}
.btn:disabled{opacity:.5;cursor:default}
.fairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fair{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper)}
.fair .g{font-weight:700;font-size:14px}
.fair .p{font-weight:800;font-size:19px;letter-spacing:-.02em;margin-top:2px}
.fair .m{font-size:11.5px;color:var(--mute);margin-top:2px}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .card{grid-template-columns:38px 92px 1fr}
.rank .no{font-weight:800;font-size:20px;color:var(--mute);line-height:1.1}
.rank .no.top{color:var(--ink)}
form.judge{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.judge label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px;min-width:0}
form.judge input,form.judge select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--panel);width:100%;min-width:0}
form.judge .full{grid-column:1/-1}
.result{margin-top:10px;padding:12px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.result .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.result ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.trades{width:100%;border-collapse:collapse;font-size:13px}
.trades th{text-align:left;font-weight:600;color:var(--mute);padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}
.trades td{padding:6px 0;border-bottom:1px solid var(--line2);white-space:nowrap}
.trades td.r,.trades th.r{text-align:right}
.trades .x{color:var(--mute);text-decoration:line-through}
.trades .dir{color:var(--dear);font-size:11px}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--mute);line-height:1.5}
.note p{margin:6px 0}
.cmp table{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:6px 4px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
.cmp th{color:var(--mute);font-weight:600;font-size:12px}
.cmp td.r{text-align:right;font-weight:600}
.cmp .rm{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--mute);font-size:12px;padding:6px 8px;min-width:44px;min-height:32px;flex:none}
.citem{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.citem.gone{opacity:.55}
.citem .ct{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.citem .cv{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.citem .cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.citem .cc{background:var(--paper);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.citem .cc span{font-size:11px;color:var(--mute)} .citem .cc b{font-size:12.5px;letter-spacing:-.02em}
.citem .cf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.cmp table th,.cmp table td{white-space:nowrap}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.setrow:last-child{border:0}
.setrow select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px}
.prog{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--cheap)}
.alert-new{border-left:3px solid var(--cheap)}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
.spark{height:40px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:600}
/* ---- 토허(토지거래허가) 컴포넌트: 급매판정 토큰으로 다시 그림 ---- */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;line-height:1.5;vertical-align:1px}
.pill.d{background:var(--dear-bg);color:var(--dear)} .pill.w{background:var(--warn-bg);color:var(--warn-ink)}
.pill.g{background:var(--ok-bg);color:var(--ok)} .pill.b{background:var(--cheap-bg);color:var(--cheap)} .pill.n{background:var(--line2);color:var(--mute)} .pill.t{background:var(--toheo-bg);color:var(--toheo)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi .l{font-size:12px;color:var(--mute)} .kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.1} .kpi .d{font-size:11.5px;color:var(--mute);margin-top:3px}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs .chip.on{background:var(--toheo);border-color:var(--toheo)}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}
@media (min-width:560px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.step .n{font-size:11px;color:var(--toheo);font-weight:800} .step .t{font-weight:700;font-size:13.5px;margin-top:1px} .step .s{font-size:11.5px;color:var(--mute);margin-top:2px}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.minis.c2{grid-template-columns:repeat(2,1fr)}
.mini{background:var(--paper);border-radius:8px;padding:7px 9px;min-width:0}
.mini .l{font-size:11px;color:var(--mute)} .mini .v{font-size:17px;font-weight:800;letter-spacing:-.02em} .mini .v small{font-size:11px;font-weight:500;color:var(--mute);margin-left:2px}
.rows .link{text-decoration:none}
.row .num{text-align:right;flex:none} .row .num .o{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1} .row .num .ol{font-size:11px;color:var(--mute)}
.row .st{font-size:12px;color:var(--mute);margin-top:1px;font-weight:400}
.row.two{flex-wrap:wrap}
.row .sp{flex-basis:100%;height:26px;margin-top:4px} .row .sp svg{width:100%;height:26px;display:block}
.row .main{min-width:0;flex:1}
.day{margin:12px 0 4px;display:flex;align-items:baseline;gap:8px} .day b{font-size:14px} .day span{font-size:12px;color:var(--mute)}
.tl{list-style:none;margin:4px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);margin-left:5px}
.tl li{position:relative;padding:2px 0 10px}
.tl li::before{content:"";position:absolute;left:-21px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--toheo);border:2px solid var(--panel)}
.tl li.gone::before{background:var(--s2)} .tl li.trade::before{background:var(--cheap)} .tl li.zone::before{background:var(--warn-ink)} .tl li.relist::before{background:var(--mute)}
.tl .t{font-weight:700;font-size:13.5px} .tl .s{font-size:12px;color:var(--mute)}
.wbar{display:flex;align-items:flex-end;gap:2px;height:80px;border-bottom:1px solid var(--line);margin-top:6px}
.wbar div{flex:1;background:var(--toheo);border-radius:3px 3px 0 0;position:relative;min-width:3px}
.wbar div span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:9px;color:var(--mute)}
.wbar + .wcap{height:16px}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.strip .dzs{flex:none;font-size:12px;padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-align:left}
.dzc{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.dzc .t{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.dzc button.t{width:100%;text-align:left;border:0;background:none;padding:0;cursor:pointer;color:inherit}
.dzc button.t::after{content:"펼치기";margin-left:auto;font-size:11px;font-weight:500;color:var(--mute)}
.dzc.open button.t::after{content:"접기"}
.dzc button.t:focus-visible{outline:2px solid var(--cheap);outline-offset:2px;border-radius:4px}
svg.chart rect.hit:focus{outline:none;stroke:var(--cheap);stroke-width:1.5}
.dzc .meta{font-size:12px;color:var(--mute);margin-top:3px} .dzc .tg{font-size:13px;margin-top:5px;color:var(--ink2)}
.dzc .more{font-size:12px;color:var(--mute);margin-top:5px;display:none} .dzc.open .more{display:block}
.ok{color:var(--ok)} .ng{color:var(--dear)}
.tblw{overflow:auto;max-height:420px}
.trades th{white-space:nowrap}
.trades td.over{color:var(--dear);font-weight:700}
.score{display:inline-block;min-width:34px;text-align:center;font-weight:800;font-size:12px;padding:1px 5px;border-radius:4px;background:var(--line2);color:var(--ink2)}
.score.hi{background:var(--toheo-bg);color:var(--toheo)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.ctl select,.ctl input[type=date]{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;font-size:13px;max-width:100%}
.ctl .chip{height:32px;display:inline-flex;align-items:center}
.pipe{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.pipe:last-child{border:0}
.pipe .st{grid-column:1/-1;font-size:12px;color:var(--mute);min-width:0}
.pipe>span{min-width:0}
.tblw .trades td,.tblw .trades th{padding-right:8px}
.pipe .pr{font-weight:700;text-align:right;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:720px){body{padding-bottom:0}nav.tabs{position:sticky;top:54px;bottom:auto;height:44px;border-top:0;border-bottom:1px solid var(--line);background:var(--top-bg)}nav.tabs a{flex-direction:row;font-size:13px;gap:6px}nav.tabs a svg{width:18px;height:18px}nav.tabs a .dot{top:10px;right:calc(50% - 34px)}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#explore">APT 레이더<small>급매판정 · 토허제 라이브</small></a>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="단지·동·구 검색" autocomplete="off" aria-label="단지 검색">
    <div class="sug" id="sug"></div>
  </div>
</div></header>

<nav class="tabs">
  <a href="#explore" data-tab="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>탐색</a>
  <a href="#complex" data-tab="complex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M14 9h5a1 1 0 0 1 1 1v11M8 8h2M8 12h2M8 16h2M17 13h1M17 17h1"/></svg>단지</a>
  <a href="#toheo" data-tab="toheo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 12h16v8H4zM8 16h8"/></svg>토허</a>
  <a href="#alerts" data-tab="alerts"><span class="dot" id="alertDot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></svg>알림</a>
  <a href="#compare" data-tab="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>비교함</a>
  <a href="#trend" data-tab="trend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>트렌드</a>
  <a href="#me" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>내정보</a>
</nav>

<main class="wrap">
  <section class="view" id="v-explore">
    <div id="progressNote"></div>
    <div class="chips" id="chips"></div>
    <div class="filters">
      <select id="fSize"><option value="">전체 평형</option><option value="0-59">~59㎡</option><option value="60-84">60~84㎡</option><option value="85-114">85~114㎡</option><option value="115-9999">115㎡~</option></select>
      <select id="fBudget"><option value="">예산 전체</option><option value="50000">5억 이하</option><option value="80000">8억 이하</option><option value="100000">10억 이하</option><option value="150000">15억 이하</option><option value="200000">20억 이하</option><option value="300000">30억 이하</option></select>
      <select id="fGrade"><option value="">모든 등급</option><option value="SS">SS만</option><option value="S">S 이상</option><option value="A">A 이상</option></select>
      <select id="fSort"><option value="diff">싼 순</option><option value="price">가격 낮은 순</option><option value="priceDesc">가격 높은 순</option><option value="new">새로 나온 순</option></select>
      <select id="fZone"><option value="">토허 전체</option><option value="zone">토허구역만</option><option value="free">비규제만</option></select>
      <label class="tg"><input type="checkbox" id="fConf" checked> 표본 부족 숨김</label>
    </div>
    <div class="sum" id="exploreSum"></div>
    <div class="list" id="exploreList"></div>
  </section>

  <section class="view" id="v-complex"></section>

  <section class="view" id="v-toheo"></section>

  <section class="view" id="v-alerts"></section>

  <section class="view" id="v-compare"></section>

  <section class="view" id="v-trend"></section>

  <section class="view" id="v-me"></section>
</main>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
// ------------------------------------------------------------ 상태
const LS = {
  get(k, d) { try { const v = localStorage.getItem('gm.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gm.' + k, JSON.stringify(v)); } catch (e) {} },
};
// 해시(fragment)의 한글은 브라우저가 퍼센트 인코딩해 돌려주므로 cid 는 항상 디코딩해서 쓴다(관심 단지·비교함 키가 어긋나지 않게)
const dec = (s) => { try { return decodeURIComponent(String(s == null ? '' : s)); } catch (e) { return String(s == null ? '' : s); } };
const S = {
  status: null, index: null, idxById: null, trend: null, top: null,
  fav: LS.get('fav', []), cmp: LS.get('cmp', []), seen: LS.get('seen', {}), set: Object.assign({ price: 'a', area: 'm2', chip: '' }, LS.get('set', {})),
  cache: {}, lcache: {}, chip: LS.get('set', {}).chip || '',
};
// 예전 버전이 인코딩된 채 저장해 둔 관심 단지·비교함 항목을 1회 정규화
S.fav = [...new Set((Array.isArray(S.fav) ? S.fav : []).map(dec).filter(Boolean))];
S.cmp = (Array.isArray(S.cmp) ? S.cmp : []).filter(x => x && x.id).map(x => ({ ...x, cid: dec(x.cid) }));
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1600); };
const json = async (p) => { if (S.cache[p]) return S.cache[p]; const r = await fetch(p, { cache: 'no-cache' }); if (!r.ok) throw new Error(p + ' ' + r.status); const j = await r.json(); S.cache[p] = j; return j; };

// ------------------------------------------------------------ 표기
function fmtPrice(p) {
  if (p == null || isNaN(p)) return '-';
  p = Math.round(p);
  const neg = p < 0; p = Math.abs(p);
  const eok = Math.floor(p / 10000), man = p % 10000;
  let s;
  if (S.set.price === 'b') s = eok ? (man ? `${eok}.${String(Math.round(man / 1000))}억` : `${eok}억`) : `${man.toLocaleString()}만`;
  else if (S.set.price === 'c') s = eok ? (man ? `${eok}억 ${man.toLocaleString()}` : `${eok}억`) : `${man.toLocaleString()}만`;
  else {
    if (!eok) s = `${man.toLocaleString()}만`;
    else if (!man) s = `${eok}억`;
    else if (man % 1000 === 0) s = `${eok}억${man / 1000}천`;
    else s = `${eok}억${man.toLocaleString()}`;
  }
  return (neg ? '−' : '') + s;
}
const fmtPct = (d) => (d == null ? '-' : (d > 0 ? '+' : d < 0 ? '−' : '') + (Math.abs(d) * 100).toFixed(1) + '%');
const fmtArea = (a, grp) => { if (a == null && grp == null) return ''; const m2 = a != null ? a : grp; return S.set.area === 'py' ? `${Math.round(m2 * 0.3025)}평` : `${grp != null ? grp : Math.floor(m2)}㎡`; };
const fmtYm = (ym) => ym ? `${ym.slice(0, 4)}.${ym.slice(4, 6)}` : '';
const fmtDate = (d) => d ? (d.length === 8 ? `${d.slice(2, 4)}.${d.slice(4, 6)}.${d.slice(6, 8)}` : d.slice(2).replace(/-/g, '.')) : '';
const daysAgo = (iso) => { if (!iso) return 999; const d = new Date(iso.slice(0, 10)); return Math.floor((Date.now() - d) / 86400000); };
const gradeHtml = (l) => l.fair ? `<span class="grade ${l.grade}">${l.grade}</span>` : `<span class="grade none">미판정</span>`;
const confTxt = { high: '신뢰 높음', mid: '신뢰 보통', low: '표본 부족' };
const sggShort = (code) => { const c = (S.status && S.status.codes || []).find(x => x.code === code); return c ? c.short : code; };
const sido = (code) => ({ '11': '서울', '41': '경기', '28': '인천' }[String(code || '').slice(0, 2)] || '');
// 매물 카드의 토허 태그: export 의 compact_listing.toheo = {zone:0|1|2, until, open, est:{p50,p90}|null}
function toheoTag(l) {
  const t = l.toheo; if (!t || !(t.zone > 0)) return '';
  const est = t.est && t.est.p50 != null ? ` · 허가 약 ${Math.round(t.est.p50)}일` : '';
  return `<span class="tag" style="color:var(--toheo);border-color:var(--toheo-bg);background:var(--toheo-bg)">${t.zone === 1 ? '일부 토허' : '토허'}${est}</span>`;
}

// ------------------------------------------------------------ 매물 카드
function listingCard(l, opt = {}) {
  const nameLine = opt.compact ? '' : `<div class="nm">${esc(l.name)}<span class="gu">${esc(sggShort(l.sgg))} ${esc(l.umd)}</span></div>`;
  const cls = !l.fair ? 'even' : l.diff <= -0.02 ? 'cheap' : l.diff >= 0.02 ? 'dear' : 'even';
  const hi = l.fair && (l.grade === 'SS' || l.grade === 'S') && l.conf !== 'low';
  const spec = [l.dongRaw, fmtArea(l.area, l.grp), l.floor != null ? `${l.floor}${l.top ? '/' + l.top : ''}층` : ''].filter(Boolean).join(' ');
  const why = l.fair ? (l.reasons && l.reasons.length ? l.reasons.slice(0, 2).map(r => l.royal && /동 보정/.test(r) ? `<span class="royal">${esc(r)}</span>` : esc(r)).join(' · ') : '동·층·타입 보정 없음') : '기준가 없음 (거래 이력 부족 또는 적재 중)';
  const inCmp = S.cmp.some(x => x.id === l.id);
  // 카드는 <div>, 단지 링크는 카드 전체를 덮는 별도 <a class="go"> (버튼을 <a> 안에 중첩하지 않음)
  return `<div class="card" data-id="${esc(l.id)}"><a class="go" href="#c-${esc(l.cid)}" aria-label="${esc(l.name || '')} 단지 페이지"></a>
    <div class="verdict">
      <span class="pct ${cls}${hi ? ' hi' : ''}">${l.fair ? fmtPct(l.diff) : '—'}</span>
      <span>${gradeHtml(l)}</span>
      <span class="conf">${l.fair ? (confTxt[l.conf] || '') : ''}</span>
    </div>
    <div class="body">
      ${nameLine}
      <div class="spec">${esc(spec)}${l.dir ? ' ' + esc(l.dir) : ''}</div>
      <div class="price">${fmtPrice(l.price)}${l.fair ? `<span class="fv">기준가 ${fmtPrice(l.fair)} (${l.diffAmt >= 0 ? '+' : ''}${fmtPrice(l.diffAmt)})</span>` : ''}</div>
      <div class="why">${why}</div>
      <div class="foot">${l.confirm ? `<span>확인 ${fmtDate(l.confirm)}</span>` : ''}${l.direct ? '<span class="tag direct">직거래</span>' : ''}${toheoTag(l)}${l.sameCnt > 1 ? `<span class="tag">중개사 ${l.sameCnt}</span>` : ''}${(l.tags || []).slice(0, 2).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
        <span class="acts"><button type="button" data-cmp="${esc(l.id)}" class="${inCmp ? 'on' : ''}" aria-pressed="${inCmp}">${inCmp ? '비교함 ✓' : '비교'}</button><button type="button" data-open="${esc(l.url)}">네이버</button></span>
      </div>
    </div></div>`;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-cmp],button[data-open]');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  if (b.dataset.open) { window.open(b.dataset.open, '_blank', 'noopener'); return; }
  const id = b.dataset.cmp;
  const l = findListing(id);
  if (!l) return;
  const i = S.cmp.findIndex(x => x.id === id);
  if (i >= 0) { S.cmp.splice(i, 1); b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); b.textContent = '비교'; toast('비교함에서 뺐어요'); }
  else { if (S.cmp.length >= 12) { toast('비교함은 12건까지'); return; } S.cmp.push(l); b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); b.textContent = '비교함 ✓'; toast('비교함에 담았어요'); }
  LS.set('cmp', S.cmp);
});
const L = {}; // id → listing (화면에 보인 것)
const findListing = (id) => L[id];
function remember(ls) { for (const l of ls) L[l.id] = l; }

// ------------------------------------------------------------ 라우팅
const views = ['explore', 'complex', 'toheo', 'alerts', 'compare', 'trend', 'me'];
function route() {
  const h = dec(location.hash.slice(1)) || 'explore';
  let tab = h, cid = null, sgg = null;
  if (h.startsWith('c-')) { tab = 'complex'; cid = h.slice(2); }
  else if (h.startsWith('toheo-r-')) { tab = 'toheo'; sgg = h.slice(8); }
  else if (h.startsWith('toheo-')) { tab = 'toheo'; const sub = h.slice(6); if (TH_SUBS.some(([k]) => k === sub)) TH.sub = sub; }
  if (!views.includes(tab)) tab = 'explore';
  views.forEach(v => $('#v-' + v).classList.toggle('on', v === tab));
  document.querySelectorAll('nav.tabs a').forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0, 0);
  ({ explore: renderExplore, complex: () => renderComplex(cid), toheo: () => renderToheo(sgg), alerts: renderAlerts, compare: renderCompare, trend: renderTrend, me: renderMe })[tab]();
}
window.addEventListener('hashchange', route);

// ------------------------------------------------------------ 시작
async function init() {
  try { S.status = await json('data/status.json'); } catch (e) { S.status = null; }
  buildChips();
  route();
  updateAlertDot();
  $('#q').addEventListener('input', onSearch);
  $('#q').addEventListener('focus', onSearch);
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) $('#sug').classList.remove('on'); });
  ['fSize', 'fBudget', 'fGrade', 'fSort', 'fZone', 'fConf'].forEach(id => $('#' + id).addEventListener('change', renderExplore));
}

// ------------------------------------------------------------ 검색
async function loadIndex() {
  if (S.index) return S.index;
  const j = await json('data/index.json');
  const f = j.fields;
  S.index = j.complexes.map(r => Object.fromEntries(f.map((k, i) => [k, r[i]])));
  S.idxById = Object.fromEntries(S.index.map(c => [c.cid, c]));
  return S.index;
}
let searchT;
function onSearch() {
  clearTimeout(searchT);
  searchT = setTimeout(async () => {
    const q = $('#q').value.trim().replace(/\s+/g, '');
    const box = $('#sug');
    if (q.length < 1) { box.classList.remove('on'); return; }
    await loadIndex();
    const ql = q.toLowerCase();
    const hits = S.index.filter(c => (c.name + c.umd + sggShort(c.sgg)).replace(/\s+/g, '').toLowerCase().includes(ql))
      .sort((a, b) => (b.hasModel - a.hasModel) || (b.nListings - a.nListings) || ((b.households || 0) - (a.households || 0))).slice(0, 30);
    box.innerHTML = hits.length ? hits.map(c => `<button type="button" data-cid="${esc(c.cid)}"><span class="nm">${esc(c.name)}</span><span>${esc(sggShort(c.sgg))} ${esc(c.umd)}</span><span class="meta">${esc(c.buildYear)}년${c.households ? ' ' + c.households + '세대' : ''}${c.nListings ? ' 매물 ' + c.nListings : ''}</span></button>`).join('')
      : `<button type="button" disabled><span class="nm">검색 결과 없음</span></button>`;
    box.classList.add('on');
    box.querySelectorAll('button[data-cid]').forEach(b => b.addEventListener('click', () => { box.classList.remove('on'); $('#q').value = ''; location.hash = 'c-' + b.dataset.cid; }));
  }, 120);
}

// ------------------------------------------------------------ 탐색
function buildChips() {
  const chips = [{ name: '전체 TOP', codes: [] }, ...((S.status && S.status.chips) || [])];
  const box = $('#chips');
  box.innerHTML = chips.map((c, i) => `<button type="button" class="chip" data-i="${i}">${esc(c.name)}</button>`).join('') + `<button type="button" class="chip" data-i="-1">직접 고르기</button>`;
  box.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    if (i === -1) { pickRegion(); return; }
    S.chip = chips[i].name === '전체 TOP' ? '' : chips[i].name; S.set.chip = S.chip; LS.set('set', S.set); renderExplore();
  }));
}
function pickRegion() {
  const codes = (S.status && S.status.codes) || [];
  const cur = S.chip.startsWith('code:') ? S.chip.slice(5) : '';
  const html = `<div class="panel"><h2>지역 고르기</h2><div class="filters"><select id="pickSgg"><option value="">선택</option>${['11', '41', '28'].map(s => `<optgroup label="${sido(s)}">${codes.filter(c => c.sido === s).map(c => `<option value="${c.code}" ${c.code === cur ? 'selected' : ''}>${esc(c.short)}</option>`).join('')}</optgroup>`).join('')}</select></div></div>`;
  $('#exploreList').innerHTML = html;
  $('#pickSgg').addEventListener('change', (e) => { if (e.target.value) { S.chip = 'code:' + e.target.value; S.set.chip = S.chip; LS.set('set', S.set); renderExplore(); } });
}
function chipCodes() {
  if (!S.chip) return null;
  if (S.chip.startsWith('code:')) return [S.chip.slice(5)];
  const c = ((S.status && S.status.chips) || []).find(x => x.name === S.chip);
  return c ? c.codes : null;
}
async function renderExplore() {
  const codes = chipCodes();
  document.querySelectorAll('#chips .chip').forEach(b => {
    const i = +b.dataset.i; const chips = [{ name: '전체 TOP' }, ...((S.status && S.status.chips) || [])];
    b.classList.toggle('on', i === -1 ? S.chip.startsWith('code:') : (i === 0 ? !S.chip : chips[i] && chips[i].name === S.chip));
  });

function judgeLocal(c, grp, area, dong, floor, price) {
  const m = c.model, g = m.groups[grp];
  if (!g || !price) return '<div class="note">호가를 입력하세요.</div>';
  const top = (dong && m.top[dong]) || m.top._ || c.highFloor || null;
  let cat = 'mid';
  if (floor != null) { if (floor <= 1) cat = 'f1'; else if (floor === 2) cat = 'f2'; else if (floor === 3) cat = 'f3'; else if (top && top >= 4 && floor >= top) cat = 'top'; else if (top && top >= 4) { const rel = floor / top; cat = rel < 0.34 ? 'low' : rel < 0.7 ? 'mid' : 'high'; } else cat = floor <= 15 ? 'mid' : 'high'; }
  const bd = dong && m.dong[dong] ? m.dong[dong].b : 0, bf = m.floor[cat] || 0;
  const tk = Object.keys(g.types).reduce((best, k) => Math.abs(+k - area) < Math.abs(+best - area) ? k : best, Object.keys(g.types)[0]);
  const bt = Math.abs(+tk - area) <= 1.5 ? g.types[tk] : 0;
  const fair = Math.round(Math.exp(g.mu + bd + bf + bt));
  const diff = price / fair - 1;
  const grade = diff <= -0.08 ? 'SS' : diff <= -0.05 ? 'S' : diff <= -0.02 ? 'A' : diff <= 0.02 ? 'B' : 'C';
  const label = { f1: '1층', f2: '2층', f3: '3층', low: '저층', mid: '중층', high: '고층', top: '최상층' }[cat];
  const reasons = [];
  if (cat !== 'mid' && Math.abs(bf) >= 0.01) reasons.push(`${label}이라 층 보정 ${fmtPct(bf)}`);
  if (dong && m.dong[dong] && Math.abs(bd) >= 0.01) reasons.push(`${dong}동 보정 ${fmtPct(bd)}${m.royal && m.royal.royal === dong ? ' (로얄동)' : ''}`);
  else if (dong && !m.dong[dong]) reasons.push(`${dong}동은 거래 이력이 없어 동 보정 없음`);
  if (Math.abs(bt) >= 0.01) reasons.push(`전용 ${tk} 타입 보정 ${fmtPct(bt)}`);
  const cls = diff <= -0.02 ? 'cheap' : diff >= 0.02 ? 'dear' : 'even';
  return `<div class="result"><div class="big ${cls}" style="color:var(--${cls === 'even' ? 'ink2' : cls})">${fmtPct(diff)} <span class="grade ${grade}">${grade}</span></div>
    <div style="margin-top:6px;font-weight:600">호가 ${fmtPrice(price)} vs 기준가 ${fmtPrice(fair)} (${price - fair >= 0 ? '+' : ''}${fmtPrice(price - fair)})</div>
    <ul>${reasons.map(r => `<li>${esc(r)}</li>`).join('')}<li>이 평형 기준가 ${fmtPrice(g.fair)} (중층·평균 동), 거래 ${g.n}건, 오차 ±${(g.sigma * 100).toFixed(1)}%</li></ul></div>`;
}
function complexText(c) {

  if (m) {

  }

async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('복사했어요'); } catch (e) { prompt('복사할 내용', t); } }
function indexChart(months, series, h = 150, dashRest = true) {
  const w = 680, p = { l: 44, r: 10, t: 12, b: 26 };
  const all = series.flatMap(s => s.v.filter(x => x != null));
  const base = series[0].v[0];
  const vals = series.map(s => s.v.map(x => x == null ? null : Math.exp(x - base) * 100));
  const flat = vals.flat().filter(x => x != null);
  let lo = Math.min(...flat), hi = Math.max(...flat); const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  const X = i => p.l + i / (months.length - 1) * (w - p.l - p.r), Y = v => p.t + (hi - v) / (hi - lo) * (h - p.t - p.b);
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
  const paths = vals.map((v, si) => `<path d="${v.map((x, i) => x == null ? '' : (i === 0 || v[i - 1] == null ? 'M' : 'L') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1)).join(' ')}" fill="none" stroke="${series[si].color}" stroke-width="${si === 0 ? 2.2 : 1.5}" ${si > 0 && dashRest ? 'stroke-dasharray="4 3"' : ''}/>`).join('');
  const xl = [0, Math.floor(months.length / 2), months.length - 1].map(i => `<text x="${X(i)}" y="${h - 6}" font-size="17" fill="var(--mute)" text-anchor="${i === 0 ? 'start' : i === months.length - 1 ? 'end' : 'middle'}">${fmtYm(months[i])}</text>`).join('');
  const yl = ticks.map(t => `<text x="${p.l - 4}" y="${Y(t) + 3}" font-size="17" fill="var(--mute)" text-anchor="end">${t.toFixed(0)}</text><line x1="${p.l}" x2="${w - p.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line2)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="지수 차트">${yl}${paths}${xl}</svg>`;
}

  $('#trendAdd').addEventListener('change', (e) => { if (e.target.value) { S.set.trendRegs = [...chosen, e.target.value]; LS.set('set', S.set); renderTrend(); } });

}
function stackChart(st) {
  const w = 680, h = 150, p = { l: 46, r: 10, t: 12, b: 26 };
  const n = st.dates.length;
  const tot = st.total;
  const ratio = tot.n.map((x, i) => x ? ((tot.SS[i] || 0) + (tot.S[i] || 0)) / x * 100 : null);
  const ratioA = tot.n.map((x, i) => x ? ((tot.SS[i] || 0) + (tot.S[i] || 0) + (tot.A[i] || 0)) / x * 100 : null);
  const hi = Math.max(5, ...ratioA.filter(x => x != null)) * 1.1;
  const X = i => n > 1 ? p.l + i / (n - 1) * (w - p.l - p.r) : p.l, Y = v => p.t + (hi - v) / hi * (h - p.t - p.b);
  const path = (arr, color, dash) => `<path d="${arr.map((x, i) => x == null ? '' : (i === 0 || arr[i - 1] == null ? 'M' : 'L') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" ${dash ? 'stroke-dasharray="4 3"' : ''}/>` + (n <= 3 ? arr.map((x, i) => x == null ? '' : `<circle cx="${X(i).toFixed(1)}" cy="${Y(x).toFixed(1)}" r="4" fill="${color}"/>`).join('') : '');
  const xl = [0, n - 1].filter((v, i, a) => a.indexOf(v) === i).map(i => `<text x="${X(i)}" y="${h - 6}" font-size="17" fill="var(--mute)" text-anchor="${i === 0 ? 'start' : 'end'}">${fmtDate(st.dates[i])}</text>`).join('');
  const yl = [0, hi / 2, hi].map(t => `<text x="${p.l - 4}" y="${Y(t) + 3}" font-size="17" fill="var(--mute)" text-anchor="end">${t.toFixed(0)}%</text><line x1="${p.l}" x2="${w - p.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line2)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="급매 비율 추이 차트">${yl}${path(ratioA, '#6B8CD0', true)}${path(ratio, 'var(--cheap)')}${xl}</svg><div class="legend"><span><i style="background:var(--cheap)"></i>SS·S</span><span><i style="background:#6B8CD0"></i>A 이상</span><span>오늘 판정 ${(tot.n[n - 1] || 0).toLocaleString()}건</span></div>`;
}

  const permitRows = recent.length ? `<div class="tblw"><table class="trades"><thead><tr><th>허가일</th><th>용도</th><th>지번</th><th>실거래 매칭</th></tr></thead><tbody>${recent.map(x => `<tr><td>${fmtDate(x.date)}</td><td>${esc(x.purpose || '-')}${x.jobGbn && x.jobGbn !== '허가' ? ` <span class="pill n">${esc(x.jobGbn)}</span>` : ''}</td><td>${esc(x.jibun || '-')}</td><td>${x.trade ? `<span class="ok">✓</span> ${tradeTxt(x.trade)}` : '<span class="note">아직 없음</span>'}</td></tr>`).join('')}</tbody></table></div>` : `<div class="note">${sido(c.sgg) === '서울' ? '이 단지로 매칭된 허가 완료 건이 아직 없어요.' : '경기·인천은 허가 내역이 공개되지 않아 단지 단위 허가 소식이 없어요.'}</div>`;
  // 타임라인
  const tl = (t.timeline || []).slice(0, 20);
  const tlHtml = tl.length ? `<ul class="tl">${tl.map(e => `<li class="${esc(e.type || '')}"><div class="t">${kdw(e.date)} · ${esc(e.text)}</div>${e.grp ? `<div class="s">${fmtArea(null, +e.grp)}</div>` : ''}</li>`).join('')}</ul>` : '<div class="note">아직 기록된 이벤트가 없어요.</div>';
  // 구 처리중·예상 승인일
  const est = r.est || (r.p50 != null ? { p50: r.p50, p90: r.p90, p25: r.p25, p75: r.p75 } : null);
  const base = t.today || thToday();   // 단지 페이지는 summary.json 을 읽지 않으므로 c/<cid>.json 의 기준일을 쓴다
  const regionHtml = r.sgg ? `<div class="minis"><div class="mini"><div class="l">처리중</div><div class="v">${fmtN(r.open)}</div></div><div class="mini"><div class="l">7일 접수</div><div class="v">${fmtN(r.received7)}</div></div><div class="mini"><div class="l">소요일 중위</div><div class="v">${f1(r.p50)}</div></div><div class="mini"><div class="l">P90</div><div class="v">${f1(r.p90)}</div></div></div>
    <div class="note" style="margin-top:6px">${est && est.p50 != null ? `${kdw(base)} 접수하면 보통 ${kdw(addDays(base, Math.round(est.p50)))}, 늦으면 ${kdw(addDays(base, Math.round(est.p75 != null ? est.p75 : est.p90)))} 완료` : '완료 관측이 쌓이면 예상 승인일이 표시됩니다'} · <a href="#toheo-r-${esc(r.sgg)}">${esc(r.label || sggShort(r.sgg))} 상세</a></div>` : '<div class="note">이 지역은 새올 접수 현황 수집 대상이 아니에요.</div>';
  return `<div class="panel">${head}
    <div class="note" style="margin-bottom:8px">${zoneLine}</div>
    <h3 style="margin:8px 0 4px">평형별 <small class="note">현재 매물 · 30일 내림(추정) · 확인된 거래</small></h3>${grpTbl}
    ${goneHtml ? `<h3 style="margin:10px 0 4px">최근 매물 내림 <small class="note">추정 · 점수는 허가 접수일 가능성</small></h3>${goneHtml}` : ''}
    <h3 style="margin:10px 0 6px">허가 완료 <small class="note">${purposes || '용도 집계 없음'}</small></h3>${permitSum}
    ${(p.weekly || []).some(v => v) ? `<div style="margin-top:8px">${weeklyBars(p.weekly, base)}</div>` : ''}
    <h3 style="margin:10px 0 4px">허가 ↔ 실거래 <small class="note">같은 단지, 허가일 이후 75일 안의 실거래를 1:1 매칭</small></h3>${permitRows}

    <h3 style="margin:10px 0 6px">${esc(r.label || '구')} 처리 현황 <small class="note">새올 전자민원</small></h3>${regionHtml}
    <div class="note" style="margin-top:8px"><p>${esc(t.note || '허가 내역에는 평형·가격이 없어 단지·지번 단위로만 맞춥니다. 매물 내림은 "허가 접수"가 아니라 추정이며, 실거래로 사후 확인된 비율(적중률)은 토허 탭에서 공개합니다.')}</p></div></div>`;
}

// ------------------------------------------------------------ 토허 탭

  const v = $('#v-toheo');
  v.innerHTML = '<div class="empty">불러오는 중…</div>';
  const sum = await loadSummary();
  if (sgg) { if (sum) return renderToheoRegion(sgg); }
  const sub = TH.sub;
  const tabsHtml = `<div class="subtabs">${TH_SUBS.map(([k, n]) => `<button type="button" class="chip ${k === sub ? 'on' : ''}" data-sub="${k}">${n}</button>`).join('')}</div>`;
  if (!sum) {
    v.innerHTML = `<div class="warn">토허 데이터가 아직 없어요. Actions 의 <b>toheo</b> 수집이 한 번 끝나면 새올 접수 현황·서울 허가 소식·지정 현황이 여기에 나타납니다.</div>
      <div class="kpis">${[['처리중 민원', '–'], ['7일 허가', '–'], ['30일 허가', '–'], ['10·15 구역', '–']].map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('')}</div>${tabsHtml}<div id="thBody"></div>`;
    bindSubtabs(); renderToheoSub(); return;
  }
  try {
    const t = sum.totals || {}, dzs = sum.designations || [];
    // 4번째 KPI: 10·15 대책(molit-2025-1219)이 살아 있으면 그것, 아니면 내국인 아파트 전체 지정 중 가장 먼저 만료되는 것
    const dzOk = x => x && x.status !== 'expired' && dzAptRelevant(x) && !x.partial && x.target_person !== '외국인등';
    const dz = [dzs.find(x => x.id === 'molit-2025-1219')].filter(dzOk)[0] || dzs.filter(x => x.status === 'active' && dzOk(x)).sort((a, b) => a.days_left - b.days_left)[0];
    const dzTitle = x => String(x.title || x.id || '').replace(/\s*\(.*\)$/, '').slice(0, 14);
    const r7 = t.received7, r30 = t.received30, chg = pctChg(r30, t.receivedPrev30);
    v.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="l">처리중 민원</div><div class="v">${fmtN(t.open)}</div><div class="d">7일 접수 ${fmtN(r7)} · 30일 ${fmtN(r30)}${chg == null ? '' : ` (${chg > 0 ? '+' : ''}${chg}%)`}</div></div>
      <div class="kpi"><div class="l">7일 허가</div><div class="v">${fmtN(t.permits7)}</div><div class="d">서울 허가 완료 · 단지 단위</div></div>
      <div class="kpi"><div class="l">30일 허가</div><div class="v">${fmtN(t.permits30)}</div><div class="d">내림 추정 ${fmtN(t.goneEst30)} · 확인 ${fmtN(t.confirmed30)}</div></div>
      <div class="kpi"><div class="l">${dz ? esc(dzTitle(dz)) : '10·15 구역'}</div><div class="v">${dz ? (dz.status === 'upcoming' ? `D-${dz.days_until_start}` : `D-${dz.days_left}`) : '–'}</div><div class="d">${dz ? `${kfull(dz.end)}까지${dz.renewal_status && dz.renewal_status !== '-' ? ' · ' + esc(dz.renewal_status) : ''}` : '지정 없음'}</div></div>
    </div>
    <div class="note" style="margin-bottom:8px">${COVERAGE_NOTE} 수집 ${esc(String(sum.generatedAt || '').replace('T', ' ').slice(0, 16))}</div>
    ${tabsHtml}<div id="thBody"></div>`;
  } catch (e) {
    console.error(e);
    v.innerHTML = `<div class="empty"><b>토허 요약을 표시하지 못했어요</b>${esc(e.message)}</div>${tabsHtml}<div id="thBody"></div>`;
  }
  bindSubtabs(); renderToheoSub();
}
function bindSubtabs() {
  document.querySelectorAll('#v-toheo .subtabs .chip').forEach(b => b.addEventListener('click', () => {
    TH.sub = b.dataset.sub; LS.set('thsub', TH.sub);
    document.querySelectorAll('#v-toheo .subtabs .chip').forEach(x => x.classList.toggle('on', x === b));
    if (location.hash !== '#toheo') history.replaceState(null, '', '#toheo');
    renderToheoSub();
  }));
}
async function renderToheoSub() {
  const box = $('#thBody'); if (!box) return;
  box.innerHTML = '<div class="empty">불러오는 중…</div>';
  const fn = { pipeline: renderPipeline, feed: renderFeed, top: renderTop, regions: renderRegions, estimate: renderEstimate, dz: renderDz }[TH.sub] || renderPipeline;
  try { await fn(box); } catch (e) { box.innerHTML = `<div class="empty"><b>표시 중 오류</b>${esc(e.message)}</div>`; console.error(e); }
}
function cxLink(cid) { return cid ? `#c-${esc(cid)}` : '#toheo'; }

// --- 파이프라인

  const steps = `<div class="steps">
    <div class="step"><div class="n">1 · 추정</div><div class="t">매물 내림</div><div class="s">네이버 매물이 사라짐 (단지·평형·호가 앎)</div></div>
    <div class="step"><div class="n">2 · 새올</div><div class="t">구 접수·처리중</div><div class="s">구 단위 건수만 · 단지 알 수 없음</div></div>
    <div class="step"><div class="n">3 · 서울</div><div class="t">허가 완료</div><div class="s">지번 → 단지 매칭 (평형 없음)</div></div>

    <div class="note" style="margin-top:6px">내림 ${fmtN(g && g.n)}건 중 확인 ${fmtN(g && g.confirmed)} · 재등록 ${fmtN(g && g.relisted)} · 미확인 ${fmtN(g && g.unconfirmed)} · 대기 ${fmtN(g && g.pending)}. 적중률 = 확인 ÷ (확인+미확인+재등록), 대기 중인 건은 제외.</div>` : '<div class="note">적중률은 매물 내림 이벤트가 75일 이상 쌓이면 계산됩니다.</div>';

  box.innerHTML = `<div class="panel"><h2>거래 파이프라인 <small>추정 → 접수 → 허가 → 실거래</small></h2>${steps}<div class="note">${COVERAGE_NOTE}</div></div>

// --- 소식(허가 피드)
async function renderFeed(box) {
  const feed = await thLoad('feed', 'data/toheo/feed.json');
  const days = (feed && feed.days) || [];
  const sggs = [...new Set(days.flatMap(d => d.items.map(i => i.sgg)))].sort((a, b) => regLabel(a).localeCompare(regLabel(b), 'ko'));
  let shown = 0; const out = [];
  for (const d of days) {
    const items = d.items.filter(it => (!TH.feedGu || it.sgg === TH.feedGu) && (!TH.feedFav || S.fav.includes(it.cid)));
    if (!items.length) continue;
    if (shown >= TH.feedDays) break; shown++;
    out.push(`<div class="day"><b>${kdw(d.date)}</b><span>허가 ${fmtN(items.reduce((a, x) => a + x.n, 0))}건 · ${items.length}개 단지</span></div><div class="rows">${items.map(it => `<a class="row link" href="${cxLink(it.cid)}"><span class="main"><b>${esc(it.name || '단지 미확인')}</b> ${it.matched === false || !it.cid ? '<span class="pill n">단지 미확인</span>' : ''}${S.fav.includes(it.cid) ? '<span class="pill w">관심</span>' : ''}<div class="st">${esc(regLabel(it.sgg))} ${esc(it.umd || '')} · ${Object.entries(it.purposes || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${esc(k)} ${v}`).join(' · ') || '용도 미상'}</div></span><span class="num"><div class="o">${it.n}</div><div class="ol">허가</div></span></a>`).join('')}</div>`);
  }
  const perm = (TH.sum && TH.sum.permits) || {};
  box.innerHTML = `<div class="ctl"><select id="thFeedGu"><option value="">전체 자치구</option>${sggs.map(s => `<option value="${esc(s)}" ${s === TH.feedGu ? 'selected' : ''}>${esc(regLabel(s))}</option>`).join('')}</select><button type="button" class="chip ${TH.feedFav ? 'on' : ''}" id="thFeedFav">관심 단지만</button><span class="note">${days.length ? `최근 ${days.length}일 · 허가일 기준 · <a href="feed/toheo/all.xml">RSS</a>` : ''}</span></div>
    ${out.join('') || `<div class="empty"><b>${perm.ok == null && !days.length ? '서울 허가 내역이 아직 수집되지 않았어요' : '표시할 소식이 없어요'}</b>${perm.ok == null && !days.length ? '첫 수집이 끝나면 날짜별 단지 소식이 여기에 쌓입니다. 경기는 허가 내역이 공개되지 않습니다.' : '조건을 바꿔 보세요.'}</div>`}
    ${shown >= TH.feedDays && shown < days.length ? '<div class="acts" style="margin-top:8px"><button type="button" class="btn" id="thFeedMore">더 보기</button></div>' : ''}`;
  $('#thFeedGu').addEventListener('change', e => { TH.feedGu = e.target.value; renderToheoSub(); });
  $('#thFeedFav').addEventListener('click', () => { TH.feedFav = !TH.feedFav; renderToheoSub(); });
  const more = $('#thFeedMore'); if (more) more.addEventListener('click', () => { TH.feedDays += 14; renderToheoSub(); });
}

// --- 단지 TOP (허가 완료 건수)

// --- 지역 현황
function visibleRegions() {
  let rs = ((TH.sum && TH.sum.regions) || []).slice();
  if (TH.regF === '서울' || TH.regF === '경기') rs = rs.filter(r => r.sido === TH.regF);
  if (TH.regF === 'dz') rs = rs.filter(r => zoneLevel(r.zone) > 0);
  rs.forEach(r => { r._delta = pctChg(r.received30, r.receivedPrev30); });
  const k = TH.regSort;
  rs.sort((a, b) => k === 'name' ? a.label.localeCompare(b.label, 'ko') : ((b[k === 'delta' ? '_delta' : k] ?? -1e9) - (a[k === 'delta' ? '_delta' : k] ?? -1e9)));
  return rs;
}
async function renderRegions(box) {
  const rs = visibleRegions();
  const ctl = `<div class="ctl">${[['all', '전체'], ['서울', '서울'], ['경기', '경기'], ['dz', '토허구역만']].map(([k, n]) => `<button type="button" class="chip ${TH.regF === k ? 'on' : ''}" data-f="${k}">${n}</button>`).join('')}<select id="thRegSort">${[['open', '처리중 많은 순'], ['received7', '최근 7일 접수'], ['received30', '최근 30일 접수'], ['delta', '30일 증감률'], ['p50', '처리일 긴 순'], ['permits30', '30일 허가 많은 순'], ['name', '이름순']].map(([k, n]) => `<option value="${k}" ${TH.regSort === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>`;
  box.innerHTML = ctl + (rs.length ? `<div class="rows">${rs.map(r => { const d = r._delta, bad = r.fetch && r.fetch.ok === false; return `<a class="row two link" href="#toheo-r-${esc(r.sgg)}"><span class="main"><b>${esc(r.label)}</b> ${zoneBadge(r.zone)} ${bad ? '<span class="pill d">수집 실패</span>' : ''}${r.fetch && r.fetch.warning ? '<span class="pill w">1페이지만</span>' : ''}<div class="st">7일 ${fmtN(r.received7)} · 30일 ${fmtN(r.received30)}${d == null ? '' : ` <span class="${d > 0 ? 'ng' : 'ok'}">(${d > 0 ? '+' : ''}${d}%)</span>`} · 완료 ${fmtN(r.completed30)} · 처리 중위 ${r.p50 == null ? '–' : f1(r.p50) + '일'}${r.sido === '서울' ? ` · 30일 허가 ${fmtN(r.permits30)}` : ''}</div></span><span class="num"><div class="o">${fmtN(r.open)}</div><div class="ol">처리중</div></span><span class="sp">${lineSpark(r.spark)}</span></a>`; }).join('')}</div>` : `<div class="empty"><b>표시할 지역이 없어요</b>${TH.sum ? '필터를 바꿔 보세요.' : '새올 수집이 끝나면 구별 처리 현황이 나타납니다.'}</div>`) + `<div class="note" style="margin-top:8px">${COVERAGE_NOTE}</div>`;
  box.querySelectorAll('.chip[data-f]').forEach(b => b.addEventListener('click', () => { TH.regF = b.dataset.f; renderToheoSub(); }));
  $('#thRegSort').addEventListener('change', e => { TH.regSort = e.target.value; renderToheoSub(); });
}

// --- 예상 승인일
async function renderEstimate(box) {
  const sum = TH.sum, rs = (sum && sum.regions) || [];
  const opts = ['<option value="all">수도권 전체</option>'];
  rs.filter(r => r.sido === '서울').forEach(r => opts.push(`<option value="${esc(r.sgg)}">${esc(r.label)}</option>`));
  rs.filter(r => r.sido !== '서울').forEach(r => opts.push(`<option value="${esc(r.sgg)}">${esc(r.label)}</option>`));
  box.innerHTML = `<div class="panel"><h2>접수일 기준 예상 처리 완료일</h2><div class="ctl"><select id="thEstR">${opts.join('')}</select><input type="date" id="thEstD" value="${esc(thToday())}"><button type="button" class="btn primary" id="thEstB">계산</button></div>
    <div id="thEstOut" class="note">지역과 접수일을 고르면 최근 완료가 관측된 민원의 소요일 분포로 범위를 계산합니다. 접수 단계는 단지를 알 수 없으므로 '어느 단지가 접수됐는지'는 보여 주지 못합니다.</div></div>
    <div class="panel"><h2>소요일 분포</h2><div id="thEstHist"><div class="note">지역을 고르세요.</div></div></div>`;
  const go = async () => {
    const vsel = $('#thEstR').value, est = vsel === 'all' ? ((sum && sum.estimates) || {}).all : estFor(vsel), reg = regOf(vsel);
    $('#thEstOut').innerHTML = sum ? estimateHtml(est, $('#thEstD').value, reg ? reg.deadlineDays : null) : '<div class="note">토허 데이터가 아직 없어요.</div>';
    const done = await thLoad('done', 'data/toheo/recent_done.json');
    let days = [];
    if (done) { if (vsel === 'all') days = Object.values(done).flat().map(x => x.n); else days = (done[vsel] || []).map(x => x.n); }
    $('#thEstHist').innerHTML = hist(days);
  };
  $('#thEstB').addEventListener('click', go); $('#thEstR').addEventListener('change', go);
  if (sum) go();
}

// --- 지정 현황
async function renderDz(box) {
  const sum = TH.sum;
  const all = ((sum && sum.designations) || []).filter(x => x.status !== 'expired');
  const apt = all.filter(dzAptRelevant).sort((a, b) => a.days_left - b.days_left);
  const land = all.filter(x => !dzAptRelevant(x)).sort((a, b) => a.days_left - b.days_left);
  const items = TH.showLand ? apt.concat(land) : apt;
  const SCOPE = { apt: '아파트', all: '모든 토지', land: '토지(도로)' };
  const title = it => String(it.title || it.id || '');
  box.innerHTML = `<div class="strip">${apt.filter(x => !x.partial).slice(0, 8).map(it => `<button type="button" class="dzs" data-id="${esc(it.id)}"><b>${esc(title(it).replace(/\s*\(.*\)$/, ''))}</b> ${dzPill(it)}</button>`).join('')}</div>
    ${items.length ? items.map(it => `<div class="dzc" data-id="${esc(it.id)}"><button type="button" class="t" aria-expanded="false" aria-controls="dzm-${esc(it.id)}">${esc(title(it))} ${dzPill(it)} <span class="pill n">${SCOPE[it.scope] || esc(it.scope || '')}${it.partial ? ' · 구역 일부' : ''}</span>${it.target_person && it.target_person !== '내국인' ? `<span class="pill b">${esc(it.target_person)}</span>` : ''}${it.renewal_status && it.renewal_status !== '-' ? `<span class="pill w">${esc(it.renewal_status)}</span>` : ''}</button>
      <div class="meta">${esc(it.authority || '')}${it.notice_no ? ` ${esc(it.notice_no)}` : ''} · ${kfull(it.start)} ~ ${kfull(it.end)} · 적용 지역 ${(it.region_ids || []).length}곳${it.threshold_m2 ? ` · 허가 기준 ${it.threshold_m2}㎡ 초과` : ''}</div><div class="tg">${esc(it.target || '')}</div>
      <div class="more" id="dzm-${esc(it.id)}">${esc(it.note || '')}${it.verified_at ? ` · 확인 ${esc(it.verified_at)}` : ''} ${it.source ? `<a href="${esc(it.source)}" target="_blank" rel="noopener">출처</a>` : ''}<br><span>${(it.region_ids || []).map(s => esc(regLabel(s))).join(', ')}</span></div></div>`).join('') : `<div class="empty"><b>지정 정보가 없어요</b>${sum ? '현재 적용 중인 지정이 없습니다.' : 'config/designations.json 이 export 되면 여기에 나타납니다.'}</div>`}
    ${land.length ? `<button type="button" class="btn" id="thDzMore">${TH.showLand ? '아파트 무관 지정 숨기기' : `아파트와 무관한 지정 ${land.length}건 보기 (도로·후보지 등)`}</button>` : ''}
    <div class="note" style="margin-top:8px">지정 현황은 고시 기준이며 구역 단위 지정(신통기획·공공재개발 등)은 포함하지 않습니다. 개별 필지는 토지이음에서 확인하세요. ${((sum && sum.designationRefs) || []).map(r => `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`).join(' · ')}</div>`;
  const setOpen = (el, open) => { el.classList.toggle('open', open); const b = el.querySelector('button.t'); if (b) b.setAttribute('aria-expanded', String(open)); };
  box.querySelectorAll('.dzc').forEach(el => el.addEventListener('click', (e) => { if (e.target.closest('a')) return; setOpen(el, !el.classList.contains('open')); }));
  box.querySelectorAll('.dzs').forEach(b => b.addEventListener('click', () => { const el = box.querySelector(`.dzc[data-id="${CSS.escape(b.dataset.id)}"]`); if (el) { setOpen(el, true); el.scrollIntoView({ block: 'center' }); } }));
  const mb = $('#thDzMore'); if (mb) mb.addEventListener('click', () => { TH.showLand = !TH.showLand; renderToheoSub(); });
}

// --- 지역 상세 (#toheo-r-<sgg>)
async function renderToheoRegion(sgg) {
  const v = $('#v-toheo'), r = regOf(sgg);
  if (!r) { v.innerHTML = `<div class="empty"><b>${esc(sggShort(sgg))} 토허 현황이 없어요</b>이 지역은 수집 대상이 아니거나 아직 수집 전입니다.<br><a href="#toheo">토허 탭으로</a></div>`; return; }
  const [daily, open, done, cx] = await Promise.all([thLoad('daily', 'data/toheo/daily.json'), thLoad('open', 'data/toheo/open_cases.json'), thLoad('done', 'data/toheo/recent_done.json'), thLoad('cx', 'data/toheo/complexes.json')]);
  const dzs = (TH.sum.designations || []).filter(x => x.status !== 'expired' && (x.region_ids || []).includes(sgg));
  const est = estFor(sgg);
  const delta = pctChg(r.received30, r.receivedPrev30);   // 지역 현황 서브탭을 거치지 않고 딥링크로 와도 계산
  const oc = ((open || {})[sgg] || []).slice().sort((a, b) => b.days - a.days);
  const sc = r.statusCounts || {};
  const cxs = (r.permitsTop && r.permitsTop.length ? r.permitsTop : ((cx && cx.items) || []).filter(x => x.sgg === sgg).sort((a, b) => b.n30 - a.n30).slice(0, 10));
  v.innerHTML = `<div class="cx-head"><h1>${esc(r.label)} ${zoneBadge(r.zone)}</h1>
      <div class="sub">${r.fetch && r.fetch.at ? `새올 수집 ${esc(String(r.fetch.at).replace('T', ' ').slice(5, 16))} · ${esc(r.fetch.host || '')}${r.fetch.error ? ` · <span class="ng">${esc(r.fetch.error)}</span>` : ''}` : '아직 수집 전'}</div>
      <div class="acts"><a class="btn" href="#toheo">← 토허</a>${r.sido === '서울' ? `<a class="btn" href="feed/toheo/${esc(sgg)}.xml">허가 소식 RSS</a>` : ''}</div></div>
    <div class="panel"><h2>토지거래허가구역</h2>${dzs.length ? dzs.map(it => `<div class="row"><span class="k"><b style="color:var(--ink)">${esc(it.title)}</b><div class="st">${esc(it.authority || '')} 지정${it.partial ? ' · 구 안의 일부 구역만' : ''} · ${esc(it.target || '')}</div></span><span class="v">${dzPill(it)}</span></div>`).join('') : '<div class="note">현재 적용되는 지정이 없습니다 (구역 단위 지정 제외).</div>'}</div>
    <div class="kpis"><div class="kpi"><div class="l">처리중</div><div class="v">${fmtN(r.open)}</div></div><div class="kpi"><div class="l">7일 접수</div><div class="v">${fmtN(r.received7)}</div></div><div class="kpi"><div class="l">30일 접수</div><div class="v">${fmtN(r.received30)}</div><div class="d">${delta == null ? '' : `직전 30일 대비 ${delta > 0 ? '+' : ''}${delta}%`}</div></div><div class="kpi"><div class="l">30일 완료(관측)</div><div class="v">${fmtN(r.completed30)}</div></div></div>
    ${r.sido === '서울' ? `<div class="panel"><h2>허가 많은 단지 <small>최근 30일</small></h2>${cxs.length ? `<div class="rows">${cxs.map(x => `<a class="row link" href="${cxLink(x.cid)}"><span class="main"><b>${esc(x.name || '단지 미확인')}</b><div class="st">${esc(x.umd || '')}${x.n90 != null ? ` · 90일 ${x.n90}` : ''}${x.last ? ` · 최근 ${fmtDate(x.last)}` : ''}</div></span><span class="num"><div class="o">${x.n30}</div><div class="ol">30일</div></span></a>`).join('')}</div>` : '<div class="note">최근 30일 이 구에 매칭된 허가 완료 건이 없어요.</div>'}</div>` : '<div class="panel"><h2>단지별 허가</h2><div class="note">경기도는 허가 내역을 온라인으로 공개하지 않아 지정 상태와 구 단위 접수 현황만 보여 줍니다.</div></div>'}
    <div class="panel"><div class="ph"><h2>일별 접수 · 처리 완료(관측) <small id="thRangeLbl"></small></h2></div><div class="ctl">${[30, 90, 180].map(n => `<button type="button" class="chip ${n === 30 ? 'on' : ''}" data-r="${n}">${n / 30}개월</button>`).join('')}</div><div id="thCh"></div><div class="note" id="thChCap" aria-live="polite">막대를 누르거나 Tab 으로 이동하면 날짜별 값이 표시됩니다</div></div>
    <div class="panel"><h2>처리 소요일 <small>완료 관측 ${fmtN(r.durationN)}건</small></h2><div class="minis"><div class="mini"><div class="l">P25</div><div class="v">${f1(r.p25)}</div></div><div class="mini"><div class="l">중위</div><div class="v">${f1(r.p50)}</div></div><div class="mini"><div class="l">P75</div><div class="v">${f1(r.p75)}</div></div><div class="mini"><div class="l">P90</div><div class="v">${f1(r.p90)}</div></div></div>
      <div class="note" style="margin-top:6px">공개 목록의 처리기한은 접수 후 보통 ${r.deadlineDays ? f1(r.deadlineDays) + '일' : '–'} · 완료 상태 분포: ${Object.entries(sc).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${esc(k)} ${fmtN(n)}`).join(', ') || '–'}</div>
      <div id="thRHist" style="margin-top:12px">${hist(((done || {})[sgg] || []).map(x => x.n))}</div></div>
    <div class="panel"><h2>예상 승인일 계산</h2><div class="ctl"><input type="date" id="thRD" value="${esc(thToday())}"><button type="button" class="btn primary" id="thRB">계산</button></div><div id="thROut" class="note">${est ? estBasis(est) : '관측된 완료 건이 아직 부족합니다'}</div></div>
    <div class="panel"><h2>처리중 민원 <small>${fmtN(oc.length)}건 · 오래된 순 · 기한 지난 건은 빨강</small></h2><div class="tblw"><table class="trades"><thead><tr><th>접수번호</th><th>접수일</th><th>처리기한</th><th class="r">경과</th><th>부서</th></tr></thead><tbody>${oc.slice(0, 400).map(c => `<tr><td>${esc(c.no)}</td><td>${fmtDate(isoDate(c.received))}</td><td class="${c.overdue ? 'over' : ''}">${fmtDate(isoDate(c.deadline))}</td><td class="r">${c.days}일</td><td class="note">${esc(c.dept || '')}</td></tr>`).join('') || `<tr><td colspan="5" class="note">${open ? '없음' : '처리중 목록 데이터가 아직 없어요'}</td></tr>`}</tbody></table></div>${oc.length > 400 ? '<div class="note">상위 400건만 표시</div>' : ''}<div class="note" style="margin-top:6px">접수 단계는 단지를 알 수 없습니다 — 새올 공개 목록에는 접수번호·민원명·처리기한·부서만 있습니다.</div></div>`;
  const draw = (n) => {
    const s = daily && daily[sgg];
    if (!s || !s.dates || !s.dates.length) { $('#thCh').innerHTML = '<div class="note">일별 집계(data/toheo/daily.json)가 아직 없어요.</div>'; return; }
    const k = Math.max(0, s.dates.length - n);
    $('#thCh').innerHTML = barChart(s.dates.slice(k), [{ name: '접수', data: s.received.slice(k), color: 'var(--toheo)' }, { name: '처리 완료(관측)', data: s.completed.slice(k), color: 'var(--s2)' }]);
    const show = (el) => { $('#thChCap').textContent = `${kdw(el.dataset.d)} · 접수 ${el.dataset.a}건 · 처리 완료(관측) ${el.dataset.b}건`; };
    $('#thCh').querySelectorAll('rect.hit').forEach(el => {
      el.addEventListener('click', () => show(el));
      el.addEventListener('focus', () => show(el));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(el); } });
    });
    $('#thRangeLbl').textContent = `최근 ${n}일`;
  };
  draw(30);
  v.querySelectorAll('.chip[data-r]').forEach(b => b.addEventListener('click', () => { v.querySelectorAll('.chip[data-r]').forEach(x => x.classList.toggle('on', x === b)); draw(+b.dataset.r); }));
  $('#thRB').addEventListener('click', () => { $('#thROut').innerHTML = estimateHtml(est, $('#thRD').value, r.deadlineDays); });
}

init();
})();
</script>
</body>
</html>
