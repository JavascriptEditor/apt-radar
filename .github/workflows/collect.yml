name: APT 레이더 수집

# 모드(DESIGN.md 3절):
#   trades    06:10 · 20:10 KST  실거래 재조회·적재 + 모델 + 단지 매칭 (+ 같은 실행에서 토허 수집, 20:10 은 deep)
#   listings  09:40 · 13:40 · 17:40 · 21:40 KST  네이버 매물 수집 (차단돼도 job 은 성공, 상태에만 표시)
#   toheo     짝수시 10분 KST  새올 민원 + 서울 허가 내역 (가벼운 수집; 20:10 KST 는 깊은 수집)
#   export    사이트 데이터만 다시 생성 (집 PC 가 data 브랜치에 푸시한 매물 반영 등)
#   model / scan  수동용
# 모든 모드 끝에 export(--notify) → data 브랜치 커밋 → Pages 배포.
# cron 은 UTC. 06:10·20:10 KST(= 21:10·11:10 UTC) 는 trades 와 toheo 가 겹치므로 trades 실행 안에서 toheo 를 이어 돌린다.

on:
  schedule:
    - cron: "10 21 * * *"                          # 06:10 KST  trades (+ toheo light)
    - cron: "10 11 * * *"                          # 20:10 KST  trades (+ toheo deep)
    - cron: "40 0,4,8,12 * * *"                    # 09:40 13:40 17:40 21:40 KST  listings
    - cron: "10 1,3,5,7,9,13,15,17,19,23 * * *"    # 10 12 14 16 18 22 00 02 04 08 KST  toheo light
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: auto
        options: [auto, trades, listings, toheo, export, model, scan]
      deep:
        description: "토허 깊은 수집 (최근 DEEP_DAYS 일 목록 전체를 다시 읽어 상태 변화 반영)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # ---- Secrets
      MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}        # 필수(실거래)
      NAVER_LAND_TOKEN: ${{ secrets.NAVER_LAND_TOKEN }}          # 선택
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}      # 선택(알림)
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}          # 선택(알림)
      # ---- Variables (비어 있으면 코드 기본값)
      MOLIT_API_URL: ${{ vars.MOLIT_API_URL }}
      DAILY_CALL_LIMIT: ${{ vars.DAILY_CALL_LIMIT }}
      REGION_FILTER: ${{ vars.REGION_FILTER }}
      NAVER_MAX_CALLS: ${{ vars.NAVER_MAX_CALLS }}
      NAVER_DELAY_SEC: ${{ vars.NAVER_DELAY_SEC }}
      MATCH_MAX_DONGS: ${{ vars.MATCH_MAX_DONGS }}
      TOHEO_REGION_FILTER: ${{ vars.TOHEO_REGION_FILTER }}
      TOHEO_DELAY_SEC: ${{ vars.TOHEO_DELAY_SEC }}
      LIGHT_DAYS: ${{ vars.LIGHT_DAYS }}
      DEEP_DAYS: ${{ vars.DEEP_DAYS }}
      MAX_PAGES: ${{ vars.MAX_PAGES }}
      PERMITS: ${{ vars.PERMITS }}
      ALERTS_JSON: ${{ vars.ALERTS_JSON }}
      SITE_URL: ${{ vars.SITE_URL }}
      DATA_DIR: data
      PYTHONUNBUFFERED: "1"      # 수집 로그를 실시간으로(버퍼링되면 몇 시간 뒤 한꺼번에 찍힌다)
    steps:
      - uses: actions/checkout@v4

      - name: data 브랜치 가져오기 (없으면 생성)
        run: |
          # 호스티드 러너에는 git 사용자 식별자가 없다 → 초기화 커밋·pull --rebase 가 'Author identity unknown' 으로 실패하지 않게
          # worktree 는 같은 .git/config 를 쓰므로 여기서 한 번만 설정하면 된다
          git config user.name collector
          git config user.email collector@users.noreply.github.com
          if git fetch origin data:data 2>/dev/null; then
            git worktree add data data
          else
            git worktree add --detach data
            cd data
            git checkout --orphan data
            git rm -rf . -q 2>/dev/null || true
            echo "# 수집 데이터" > README.md
            git add README.md
            git commit -qm "init data"
            cd ..
          fi
          ls data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 모드 결정
        id: mode
        env:
          IN_MODE: ${{ github.event.inputs.mode || 'auto' }}
          IN_DEEP: ${{ github.event.inputs.deep || 'false' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="$IN_MODE"; TOHEO=0; DEEP=0
          if [ "$MODE" = "auto" ]; then
            case "$SCHEDULE" in
              "40 0,4,8,12 * * *") MODE=listings ;;
              "10 1,3,5,7,9,13,15,17,19,23 * * *") MODE=toheo ;;
              "10 11 * * *") MODE=trades; TOHEO=1; DEEP=1 ;;   # 20:10 KST
              "10 21 * * *") MODE=trades; TOHEO=1 ;;           # 06:10 KST
              *) MODE=trades; TOHEO=1 ;;                        # 수동 auto = 06:10 실행과 같게(실거래 + 토허)
            esac
          fi
          [ "$MODE" = "toheo" ] && TOHEO=1
          [ "$IN_DEEP" = "true" ] && DEEP=1
          # 토허 데이터가 아직 없으면 첫 실행은 깊게
          [ "$TOHEO" = "1" ] && [ ! -f data/toheo/cases.csv ] && DEEP=1
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "toheo=$TOHEO" >> "$GITHUB_OUTPUT"
          echo "deep=$DEEP" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE toheo=$TOHEO deep=$DEEP"

      # 미설정 Variables 는 빈 문자열로 들어오는데, 코드는 빈 값을 '미설정' 으로 취급한다(NAVER_DELAY_SEC·PERMITS 등).
      # 각 수집 스텝은 실패해도(continue-on-error) export·커밋·배포까지 진행한 뒤 마지막 스텝에서 job 을 실패로 표시한다
      # — 그래야 수천 회 호출 뒤 죽어도 progress.json(callsToday)·fetch_log 가 커밋되고, 실패가 Actions 에 빨갛게 남는다.
      - name: 실거래 수집 · 모델 · 단지 매칭
        id: trades
        if: steps.mode.outputs.mode == 'trades'
        continue-on-error: true
        env:
          TRADES_MAX_SEC: ${{ vars.TRADES_MAX_SEC || '6000' }}   # 100분: 다음 예약 실행(토허 08:10)과 겹치지 않게
        run: |
          if [ -z "$MOLIT_SERVICE_KEY" ]; then
            echo "::warning::MOLIT_SERVICE_KEY Secret 이 없어 실거래 수집을 건너뜁니다 (토허 수집만 동작)"
            exit 0
          fi
          python -m collector run

      - name: 네이버 매물 수집 (차단되면 상태에만 표시)
        id: listings
        if: steps.mode.outputs.mode == 'listings'
        continue-on-error: true
        env:
          # 집 PC(listings-home.yml / scripts) 가 직전 2시간 안에 성공 수집했으면 건너뜀 (같은 상태기계 이중 실행 방지)
          LISTINGS_MIN_INTERVAL_MIN: ${{ vars.LISTINGS_MIN_INTERVAL_MIN || '120' }}
        run: python -m collector listings

      - name: 토허 수집 (새올 민원 · 서울 허가 내역)
        id: toheo
        if: steps.mode.outputs.toheo == '1'
        continue-on-error: true
        env:
          DEEP: ${{ steps.mode.outputs.deep }}
          # 서울 새올·land.seoul.go.kr 이 러너 IP 를 막는 날은 연결 타임아웃만 반복된다 → 호스트별로 빨리 포기하고
          # 전체 실행은 이 시간 안에 끝낸다(남은 지역은 '시간 상한' 으로 건너뛰고 다음 실행에서 이어감)
          TOHEO_MAX_SEC: ${{ vars.TOHEO_MAX_SEC || '1500' }}
        run: |
          if [ "$DEEP" = "1" ]; then python -m collector toheo --deep; else python -m collector toheo; fi

      - name: 모델만
        if: steps.mode.outputs.mode == 'model'
        run: python -m collector model --partial

      - name: 신설 구 탐색
        if: steps.mode.outputs.mode == 'scan'
        run: python -m collector scan --force

      - name: 사이트 데이터 생성 (+ 텔레그램 요약 알림)
        id: export
        continue-on-error: true
        run: python -m collector export --out site --notify

      - name: data 브랜치 커밋
        id: commit
        if: always()
        continue-on-error: true    # 푸시 실패도 Pages 배포·최종 요약까지 진행한 뒤 job 실패로 표시
        run: |
          [ -d data/.git ] || [ -f data/.git ] || { echo "data worktree 없음"; exit 0; }
          cd data
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -qm "collect ${{ steps.mode.outputs.mode }} $(date -u +'%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3; do
            if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
              # 집 PC(listings-home / scripts) 가 그 사이 푸시했을 수 있으니 받아서 얹는다(충돌 시 이쪽 우선)
              if git pull --rebase -X theirs origin data && git push origin HEAD:data; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
            else
              # 첫 실행: 원격에 data 브랜치가 아직 없다 → 그대로 올린다(pull 할 대상이 없음)
              echo "원격 data 브랜치가 없어 새로 만듭니다"
              if git push -u origin HEAD:data; then
                exit 0
              fi
            fi
            sleep $((i * 10))
          done
          echo "::error::data 브랜치 푸시 실패 — 수집 결과가 저장되지 않았습니다 (집 PC 푸시와 겹침? 권한?)"
          exit 1

      - uses: actions/configure-pages@v5
        if: steps.export.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: steps.export.outcome == 'success'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.export.outcome == 'success'

      - name: 수집 스텝 실패를 job 결과에 반영
        if: always()
        env:
          R_TRADES: ${{ steps.trades.outcome }}
          R_LISTINGS: ${{ steps.listings.outcome }}
          R_TOHEO: ${{ steps.toheo.outcome }}
          R_EXPORT: ${{ steps.export.outcome }}
          R_COMMIT: ${{ steps.commit.outcome }}
        run: |
          FAIL=0
          for s in trades listings toheo export commit; do
            v="R_$(echo $s | tr a-z A-Z)"
            if [ "${!v}" = "failure" ]; then echo "::error::$s 스텝 실패 — 로그와 사이트 내정보 탭의 상태를 확인하세요"; FAIL=1; fi
          done
          exit $FAIL
