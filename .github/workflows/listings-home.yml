name: 매물 수집 (집 PC self-hosted)

# 선택 사항. 네이버가 GitHub Actions(해외 IP)를 막을 때, 집 PC 를 self-hosted runner 로 등록해 두면
# 이 워크플로가 집 PC 에서 `python -m collector listings` 를 돌려 data 브랜치에 푸시만 한다.
# export·Pages 배포는 다음 collect.yml 실행(또는 수동 mode=export)이 처리한다.
#
# 준비: Settings → Actions → Runners → New self-hosted runner (라벨 self-hosted 기본값), 집 PC 에 Python 3.12 + git.
# runner 없이 쓰려면 scripts/home_listings.sh(.ps1) 을 집 PC 의 스케줄러로 돌려도 같은 결과.

on:
  schedule:
    - cron: "0 1,5,9,13 * * *"      # 10:00 14:00 18:00 22:00 KST (collect.yml 의 매물 수집과 20분 어긋나게)
  workflow_dispatch:
    inputs:
      max_calls:
        description: "실행당 네이버 호출 상한 (비우면 NAVER_MAX_CALLS 또는 1500)"
        default: ""

permissions:
  contents: write

concurrency:
  group: listings-home
  cancel-in-progress: false

jobs:
  listings:
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      REGION_FILTER: ${{ vars.REGION_FILTER }}
      NAVER_MAX_CALLS: ${{ github.event.inputs.max_calls || vars.NAVER_MAX_CALLS }}
      NAVER_DELAY_SEC: ${{ vars.NAVER_DELAY_SEC }}
      NAVER_LAND_TOKEN: ${{ secrets.NAVER_LAND_TOKEN }}
      DATA_DIR: data
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: data 브랜치 worktree
        shell: bash
        run: |
          git worktree prune
          rm -rf data
          git fetch origin data:data --update-head-ok
          git worktree add data data
          ls data | head

      - name: 의존성 설치
        shell: bash
        run: python -m pip install -q -r requirements.txt

      - name: 네이버 매물 수집
        shell: bash
        run: |
          # 빈 Variables 는 코드 기본값을 쓰도록 지움
          for v in REGION_FILTER NAVER_MAX_CALLS NAVER_DELAY_SEC NAVER_LAND_TOKEN; do
            [ -z "${!v}" ] && unset "$v" || true
          done
          python -m collector listings

      - name: data 브랜치 푸시
        shell: bash
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git -c user.name=collector-home -c user.email=collector-home@users.noreply.github.com \
            commit -qm "listings(home) $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Actions 쪽 커밋이 먼저 들어갔으면 그 위에 얹는다(충돌 시 집 PC 결과 우선)
          git pull --rebase -X theirs origin data || { git rebase --abort 2>/dev/null || true; }
          git push origin HEAD:data

      - name: worktree 정리
        if: always()
        shell: bash
        run: git worktree remove --force data || true
